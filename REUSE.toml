version = 1
SPDX-PackageName = "Glacier"
SPDX-PackageDownloadLocation = "https://github.com/Glacier-Jellyfin/glacier-androidtv"

# Everything that is not listed below is Glacier's own work.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Glacier contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Media3's decoder_ffmpeg module, vendored (see core/ffmpeg/README.md).
# FFmpeg itself is downloaded at build time and is not part of this repository.
[[annotations]]
path = ["core/ffmpeg/src/main/java/**", "core/ffmpeg/src/main/jni/CMakeLists.txt", "core/ffmpeg/src/main/jni/ffmpeg_jni.cc"]
precedence = "override"
SPDX-FileCopyrightText = "The Android Open Source Project"
SPDX-License-Identifier = "Apache-2.0"

# Gradle wrapper.
[[annotations]]
path = ["gradlew", "gradlew.bat", "gradle/wrapper/**"]
precedence = "override"
SPDX-FileCopyrightText = "Gradle authors"
SPDX-License-Identifier = "Apache-2.0"

# Fonts and their licence texts.
[[annotations]]
path = ["core/designsystem/src/main/res/font/google_sans.ttf", "core/designsystem/src/main/assets/licenses/google-sans-OFL.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2025 The Google Sans Project Authors (https://github.com/googlefonts/googlesans)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["website/assets/fonts/bricolage-grotesque-*.woff2", "website/assets/fonts/OFL-bricolage-grotesque.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2022 The Bricolage Grotesque Project Authors (https://github.com/ateliertriay/bricolage)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["website/assets/fonts/caveat-*.woff2", "website/assets/fonts/OFL-caveat.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2014 The Caveat Project Authors (https://github.com/googlefonts/caveat)"
SPDX-License-Identifier = "OFL-1.1"

# Language flags (flag-icon-css, see the LICENSE next to them).
[[annotations]]
path = "app/src/main/assets/flags/**"
precedence = "override"
SPDX-FileCopyrightText = "2013 Panayiotis Lipiridis"
SPDX-License-Identifier = "MIT"

# Dolby Vision RPUs from dovi_tool's test assets and what dovi_tool made of them.
[[annotations]]
path = "core/player/src/test/resources/dolby-vision/*.bin"
precedence = "override"
SPDX-FileCopyrightText = "quietvoid"
SPDX-License-Identifier = "MIT"

# Our test pattern, with a dovi_tool RPU in every frame.
[[annotations]]
path = "core/player/src/test/resources/dolby-vision/*.hevc"
precedence = "override"
SPDX-FileCopyrightText = ["Glacier contributors", "quietvoid"]
SPDX-License-Identifier = "GPL-3.0-or-later AND MIT"
