# Applied on top of detekt's defaults (buildUponDefaultConfig).

naming:
  # The application id uses underscores (glacier_jellyfin).
  PackageNaming:
    active: false
  FunctionNaming:
    # Composables are PascalCase by convention.
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

complexity:
  LongParameterList:
    allowedFunctionParameters: 6
    allowedConstructorParameters: 8
    ignoreDefaultParameters: true
    # Composables take many slots and modifiers; Hilt constructors take dependencies.
    ignoreAnnotated: ['Composable', 'Inject']
  LongMethod:
    ignoreAnnotated: ['Composable']
  CyclomaticComplexMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    ignorePrivate: true
    ignoreOverridden: true

style:
  MagicNumber:
    # dp/sp values, colors and durations are the content of UI code.
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreNumbers: ['-1', '0', '1', '2', '3', '4', '5', '10', '16', '24', '60', '100', '255', '1000', '1024']
    ignoreAnnotation: true
    ignoreNamedArgument: true
    ignoreExtensionFunctions: true
    ignoreAnnotated: ['Composable', 'Preview']
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
      - '**/designsystem/**'
  ReturnCount:
    max: 4
    excludeGuardClauses: true
  MaxLineLength:
    maxLineLength: 120
    excludeCommentStatements: true

# ktlint rules (detekt-rules-ktlint-wrapper), including the layout rules that
# ./gradlew detekt -PdetektAutoCorrect fixes. The code style comes from
# .editorconfig (the wrapper does not read it, so code_style and the limits
# are repeated here). Line length is checked by style>MaxLineLength.
ktlint:
  code_style: 'android_studio'
  MaximumLineLength:
    active: false
  PackageName:
    active: false
  FunctionNaming:
    active: false
  ArgumentListWrapping:
    maxLineLength: 120
  BinaryExpressionWrapping:
    maxLineLength: 120
  ClassSignature:
    maxLineLength: 120
    forceMultilineWhenParameterCountGreaterOrEqualThan: '3'
  FunctionLiteral:
    maxLineLength: 120
  FunctionSignature:
    maxLineLength: 120
    forceMultilineWhenParameterCountGreaterOrEqualThan: 3
  ParameterListWrapping:
    maxLineLength: 120
  PropertyWrapping:
    maxLineLength: 120
  Wrapping:
    maxLineLength: 120
  TrailingCommaOnCallSite:
    useTrailingCommaOnCallSite: true
  TrailingCommaOnDeclarationSite:
    useTrailingCommaOnDeclarationSite: true

# Project rules from the :detekt-rules module.
glacier:
  WhenConditionPerLine:
    active: true
  DanglingShortArguments:
    active: true
