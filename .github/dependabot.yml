version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    # New releases wait a week, so a hijacked release is usually pulled before it arrives.
    # Security updates are not delayed.
    cooldown:
      default-days: 7
    groups:
      androidx:
        patterns: ['androidx.*']
      kotlin:
        patterns: ['org.jetbrains.kotlin*', 'com.google.devtools.ksp*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # New releases wait a week, so a hijacked release is usually pulled before it arrives.
    # Security updates are not delayed.
    cooldown:
      default-days: 7
