version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    # Titles must pass the Conventional Commits check on pull requests.
    commit-message:
      prefix: 'build(deps)'
    # New releases wait a week, so a hijacked release is usually pulled before it arrives.
    # Security updates are not delayed.
    cooldown:
      default-days: 7
    groups:
      androidx:
        patterns: ['androidx.*']
      kotlin:
        patterns: ['org.jetbrains.kotlin*', 'com.google.devtools.ksp*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Titles must pass the Conventional Commits check on pull requests.
    commit-message:
      prefix: 'ci(deps)'
    # New releases wait a week, so a hijacked release is usually pulled before it arrives.
    # Security updates are not delayed.
    cooldown:
      default-days: 7
    groups:
      # Every codeql-action step in a workflow must run the same version.
      codeql:
        patterns: ['github/codeql-action*']

  # The ClusterFuzzLite image is pinned by digest.
  - package-ecosystem: docker
    directory: /.clusterfuzzlite
    schedule:
      interval: weekly
    # Titles must pass the Conventional Commits check on pull requests.
    commit-message:
      prefix: 'ci(deps)'
    cooldown:
      default-days: 7
