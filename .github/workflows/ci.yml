name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: ./.github/actions/ffmpeg

      - name: Unit tests, lint and debug build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      # Optimised with R8 like a release, so shrinking problems show up before tagging.
      - name: Staging build
        run: ./gradlew :app:assembleStaging

      - name: FFmpeg decoder in the APK
        run: scripts/check-ffmpeg-apk.sh app/build/outputs/apk/staging/app-staging.apk

      # For local builds on machines that cannot run scripts/build-ffmpeg.sh (see core/ffmpeg/README.md).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-android
          path: core/ffmpeg/src/main/jni/ffmpeg/
          retention-days: 30

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: reports
          path: '**/build/reports/'
          retention-days: 7
