name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Code scanning uploads (detekt, Android Lint).
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Scorecard only accepts the committed gradle-wrapper.jar when a workflow validates it.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: ./.github/actions/ffmpeg

      - name: Unit tests, lint, detekt and debug build
        run: ./gradlew --continue testDebugUnitTest lintDebug detekt assembleDebug koverXmlReport koverHtmlReport

      - name: Coverage summary
        if: always()
        run: |
          report=build/reports/kover/report.xml
          if [ -f "$report" ]; then
            # The last top-level LINE counter is the total over all modules.
            counter=$(grep -o '<counter type="LINE" missed="[0-9]*" covered="[0-9]*"/>' "$report" | tail -n 1)
            missed=$(echo "$counter" | sed -E 's/.*missed="([0-9]+)".*/\1/')
            covered=$(echo "$counter" | sed -E 's/.*covered="([0-9]+)".*/\1/')
            total=$((missed + covered))
            {
              echo "### Test coverage"
              if [ "$total" -gt 0 ]; then
                echo "Line coverage: $((covered * 100 / total)).$((covered * 1000 / total % 10))% ($covered of $total lines)"
              else
                echo "No coverage data."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No Kover report found." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Fork PRs get a read-only token and cannot upload to code scanning.
      # Every SARIF run needs its own automationDetails.id (= category), otherwise
      # the upload is rejected for having several runs in one category.
      - name: Collect SARIF reports
        if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          mkdir -p sarif/detekt sarif/android-lint
          while IFS= read -r f; do
            module="${f#./}"
            module="${module%/build/reports/*}"
            id="detekt/${module//\//-}/"
            jq --arg id "$id" '.runs[].automationDetails.id = $id' "$f" > "sarif/detekt/${module//\//_}.sarif"
          done < <(find . -path '*/build/reports/detekt/detekt.sarif')
          while IFS= read -r f; do
            module="${f#./}"
            module="${module%/build/reports/*}"
            variant="$(basename "$f" .sarif)"
            variant="${variant#lint-results-}"
            id="android-lint/${module//\//-}/${variant}/"
            jq --arg id "$id" '.runs[].automationDetails.id = $id' "$f" > "sarif/android-lint/${module//\//_}_${variant}.sarif"
          done < <(find . -path '*/build/reports/lint-results-*.sarif')

      # No category input here: it would override the per-run ids set above.
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && hashFiles('sarif/detekt/*') != ''
        with:
          sarif_file: sarif/detekt

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && hashFiles('sarif/android-lint/*') != ''
        with:
          sarif_file: sarif/android-lint

      # Optimised with R8 like a release, so shrinking problems show up before tagging.
      - name: Staging build
        run: ./gradlew :app:assembleStaging

      - name: FFmpeg decoder in the APK
        run: scripts/ffmpeg/check-ffmpeg-apk.sh app/build/outputs/apk/staging/app-staging.apk

      # For local builds on machines that cannot run scripts/ffmpeg/build-ffmpeg.sh (see core/ffmpeg/README.md).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg-android
          path: core/ffmpeg/src/main/jni/ffmpeg/
          retention-days: 30

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reports
          path: '**/build/reports/'
          retention-days: 7

  reuse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The REUSE tool straight from PyPI, so no third-party action has to be allowed.
      - run: pipx run reuse==6.3.0 lint
