name: Fuzzing (weekly)

# ClusterFuzzLite fuzzes every target of the :fuzz module for an hour and keeps
# the corpus it grows as an artifact for the next run and for pull requests.
on:
  schedule:
    - cron: '17 3 * * 6'
  workflow_dispatch:

# A manual run while the weekly one is going would fuzz the same corpus twice.
concurrency:
  group: cflite-batch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Downloads the corpus of the previous run, a workflow artifact.
      actions: read
    steps:
      # The actions check out the repository themselves.
      - name: Build fuzz targets
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: jvm
          sanitizer: address
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fuzz all targets
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: jvm
          sanitizer: address
          mode: batch
          # Shared by all targets.
          fuzz-seconds: 3600
          github-token: ${{ secrets.GITHUB_TOKEN }}
