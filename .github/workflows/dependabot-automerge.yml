name: Dependabot auto-merge

# Turns on auto-merge for low-risk Dependabot updates. The pull request still
# has to pass the required checks first. Major versions are never merged here.
# This runs on pull_request, not pull_request_target, so the token has no
# access to secrets and the pull request's code is never checked out.
on: pull_request

permissions:
  contents: read

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # Actions: patch and minor. Gradle: patch only, as libraries can break the app on minor bumps.
      - if: >
          (steps.metadata.outputs.package-ecosystem == 'github_actions' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor')) ||
          (steps.metadata.outputs.package-ecosystem == 'gradle' &&
          steps.metadata.outputs.update-type == 'version-update:semver-patch')
        name: Enable auto-merge
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge --auto --squash "$PR_URL"
